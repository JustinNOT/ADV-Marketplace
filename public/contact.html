<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdVehicles — Contact</title>

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    .container{max-width:900px;margin:0 auto;padding:0 20px}
    .site-header{border-bottom:1px solid var(--border-1)}
    .nav{display:flex;justify-content:space-between;align-items:center;height:62px}
    .brand{font-weight:700;text-decoration:none;color:var(--text-1)}
    .nav a{color:var(--text-1);opacity:.9;text-decoration:none;padding:8px 10px;border-radius:10px}
    .nav a:hover{background:rgba(255,255,255,.06);opacity:1}
    .card{padding:18px}
    .grid{display:grid;gap:16px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .muted{color:var(--text-2)}
    .site-footer{border-top:1px solid var(--border-1);padding:24px 0;color:var(--text-2);text-align:center}
    .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a class="brand" href="/">AdVehicles</a>
        <div class="nav-links">
          <a href="/browse.html">Browse</a>
          <a href="/submit.html">Become a Driver</a>
          <a href="/contact.html" class="active">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:24px 0">
    <h1>Contact</h1>
    <section class="card grid">
      <div class="row">
        <strong>Phone:</strong>
        <a href="tel:+14379851880">437-985-1880</a>
      </div>
      <div class="row">
        <strong>Email:</strong>
        <a href="mailto:2justinbusiness@gmail.com">2justinbusiness@gmail.com</a>
      </div>
      <p class="muted">Business hours: Mon–Fri, 9am–6pm (local time)</p>
      <div class="ctas">
        <a class="ghost btn" href="/">Back to Home</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2025 AdVehicles • <a href="/privacy.html">Privacy</a> • <a href="/terms.html">Terms</a></p>
    </div>
  </footer>
</body>
</html>
