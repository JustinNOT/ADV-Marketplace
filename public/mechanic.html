<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mechanic Dashboard — AdVehicles</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    .card { border:1px solid #ddd; border-radius:12px; padding:16px; margin:10px 0; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    input,button{ padding:8px 10px; border:1px solid #ccc; border-radius:8px; }
    button{ cursor:pointer }
    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
    .muted{ color:#666; font-size:12px; }
    .hidden{ display:none !important; }
    img.thumb { width:180px; height:auto; border-radius:8px; border:1px solid #eee; object-fit:cover; }
    .pill { padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid #ddd }
  </style>
</head>
<body>
  <h1>Mechanic Dashboard</h1>

  <div id="login" class="card">
    <h3>Sign in</h3>
    <div class="row">
      <input id="user" placeholder="Mechanic ID" autocomplete="username" />
      <input id="pass" placeholder="Password" type="password" autocomplete="current-password" />
      <button id="signin" type="button">Sign in</button>
      <span id="status" class="muted"></span>
    </div>
    <div class="muted" style="margin-top:6px">
      Use the ID/password we provided (e.g., ID <code>orangeautoservices</code>, PW <code>DriveOAS</code>).
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="row">
      <strong id="mechName"></strong>
      <span class="muted" id="mechSlug"></span>
      <span style="flex:1"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <span id="count" class="muted"></span>
    </div>
    <div id="list" class="grid" style="margin-top:10px;"></div>
  </div>

  <script src="/js/mechanic.js"></script>
</body>
</html>
