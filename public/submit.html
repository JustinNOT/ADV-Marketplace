<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Driver Submission</title>

  <!-- use your existing theme -->
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <!-- top nav -->
  <header class="site-header">
    <div class="container row" style="justify-content:space-between; align-items:center;">
      <a href="/index.html" class="btn" style="text-decoration:none;">← Back to Home</a>
      <div></div>
    </div>
  </header>

  <main class="container">
    <h1>Driver Submission</h1>
    <p class="muted">Upload a clear photo of your vehicle. Max 5MB, image files only.</p>

    <!-- keep id + enctype for existing submit.js -->
    <form id="driverForm" enctype="multipart/form-data" class="card">

      <!-- Honeypot (hidden) -->
      <div style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;">
        <label>Website <input name="website" autocomplete="off" tabindex="-1" /></label>
      </div>

      <!-- Contact -->
      <fieldset>
        <legend>Contact</legend>
        <div class="grid-3">
          <div class="field">
            <label for="name">Full Name *</label>
            <input id="name" name="name" maxlength="80" required />
          </div>
          <div class="field">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" maxlength="254" required />
          </div>
          <div class="field">
            <label for="phone">Phone *</label>
            <input id="phone" name="phone" maxlength="40" required />
          </div>
        </div>

        <!-- NEW: visible mechanic field -->
        <div class="grid-1">
          <div class="field">
            <label for="mechanic">Mechanic (ID/slug)</label>
            <input id="mechanic" name="mechanic" maxlength="64" placeholder="e.g., ABC auto" />
          </div>
        </div>
      </fieldset>

      <!-- Location -->
      <fieldset>
        <legend>Location</legend>
        <div class="grid-3">
          <div class="field">
            <label for="city">City *</label>
            <input id="city" name="city" maxlength="40" required />
          </div>
          <div class="field">
            <label for="province">Province/State *</label>
            <input id="province" name="province" maxlength="40" required />
          </div>
          <div class="field">
            <label for="country">Country *</label>
            <input id="country" name="country" maxlength="56" value="Canada" required />
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="postalCode">Postal Code</label>
            <input id="postalCode" name="postalCode" maxlength="12" />
          </div>
          <div class="field">
            <label for="otherCities">Also visits (other cities)</label>
            <input id="otherCities" name="otherCities" placeholder="Comma-separated e.g., Mississauga, North York" />
          </div>
        </div>
      </fieldset>

      <!-- Vehicle -->
      <fieldset>
        <legend>Vehicle</legend>
        <div class="grid-3">
          <div class="field">
            <label for="carMake">Make *</label>
            <input id="carMake" name="carMake" maxlength="40" required />
          </div>
          <div class="field">
            <label for="carModel">Model *</label>
            <input id="carModel" name="carModel" maxlength="40" required />
          </div>
          <div class="field">
            <label for="carYear">Year *</label>
            <input id="carYear" name="carYear" type="number" min="1990" max="2030" required />
          </div>
        </div>
        <div class="grid-3">
          <div class="field">
            <label for="color">Color</label>
            <input id="color" name="color" maxlength="24" />
          </div>
          <div class="field">
            <label for="seats">Seats</label>
            <input id="seats" name="seats" type="number" min="1" max="9" value="5" />
          </div>
          <div class="field">
            <label for="weeklyMileage">Weekly mileage (km)</label>
            <input id="weeklyMileage" name="weeklyMileage" type="number" min="0" max="5000" />
          </div>
        </div>
      </fieldset>

      <!-- Driving Patterns -->
      <fieldset>
        <legend>Driving Patterns</legend>
        <div class="grid-2">
          <div class="field">
            <label for="avgDailyDrivingHours">Average daily driving hours</label>
            <input id="avgDailyDrivingHours" name="avgDailyDrivingHours" type="number" min="0" max="24" />
          </div>
          <div class="field">
            <label for="typicalRoutes">Typical routes</label>
            <input id="typicalRoutes" name="typicalRoutes" maxlength="500" />
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="availability">Availability</label>
            <input id="availability" name="availability" maxlength="500" />
          </div>
          <div class="field">
            <label for="vehicleCondition">Vehicle condition</label>
            <input id="vehicleCondition" name="vehicleCondition" maxlength="120" />
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="restrictions">Restrictions</label>
            <input id="restrictions" name="restrictions" maxlength="120" />
          </div>
          <div class="field">
            <label for="monthlyRate">Monthly rate ($) <small>(set later by admin)</small></label>
            <input id="monthlyRate" name="monthlyRate" type="number" min="0" max="1000" value="0" />
          </div>
        </div>
      </fieldset>

      <!-- Preferences -->
      <fieldset>
        <legend>Ad placement preferences</legend>
        <div class="row">
          <label><input type="checkbox" name="placement" value="Rear Window" /> Rear Window</label>
          <label><input type="checkbox" name="placement" value="Side Doors" /> Side Doors</label>
          <label><input type="checkbox" name="placement" value="Hood" /> Hood</label>
        </div>
      </fieldset>

      <!-- Verification & Notes -->
      <fieldset>
        <legend>Verification & Notes</legend>
        <div class="grid-2">
          <div class="field">
            <label for="image">Photo (jpg/png, max 5MB)</label>
            <input id="image" name="image" type="file" accept="image/*" />
          </div>
          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Anything we should know?"></textarea>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="ig">Instagram</label>
            <input id="ig" name="ig" maxlength="100" placeholder="@handle" />
          </div>
          <div class="field">
            <label for="tiktok">TikTok</label>
            <input id="tiktok" name="tiktok" maxlength="100" placeholder="@handle" />
          </div>
        </div>
        <div class="row">
          <label><input type="checkbox" id="allowLocationTracking" name="allowLocationTracking" /> Allow location tracking</label>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="btn">Submit</button>
        <span class="muted">By submitting you agree to be contacted about campaigns.</span>
      </div>
    </form>
  </main>

  <!-- Auto-fill visible mechanic from query (?m= or ?mechanic=) -->
  <script>
    (function () {
      var mech = document.getElementById('mechanic');
      if (!mech) return;
      var params = new URLSearchParams(location.search);
      var fromQuery = (params.get('mechanic') || params.get('m') || '').trim();
      if (fromQuery) mech.value = fromQuery;
    })();
  </script>

  <!-- your existing submit handler -->
  <script src="/js/submit.js"></script>
</body>
</html>
