<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdVehicles Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    h1 { margin: 0 0 16px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
    .card { border:1px solid #ddd; border-radius:12px; padding:16px; margin:10px 0; box-shadow:0 1px 2px rgba(0,0,0,.04);}
    .muted{ color:#666; font-size:12px; }
    input,select,button{ padding:8px 10px; border:1px solid #ccc; border-radius:8px; }
    button{ cursor:pointer; }
    .danger{ background:#ffe9e9; border-color:#ffbcbc }
    .ok{ background:#e7ffe9; border-color:#bdf5c7 }
    .warn{ background:#fff8e1; border-color:#ffe3a3 }
    .grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:12px; }
    .pill{ display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #ddd; font-size:12px; margin-right:6px; }
    .toolbar { position: sticky; top: 0; background: #fff; padding: 8px 0; margin-bottom: 8px; border-bottom: 1px solid #eee; }
    .login { max-width: 520px; margin: 24px 0; }
    .debug { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; max-height: 300px; overflow:auto; padding:10px; border:1px solid #eee; border-radius:8px; background:#0b1220; color:#b8ffbd; }
    img.thumb { width:180px; height:auto; border-radius:8px; border:1px solid #eee; object-fit:cover; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <h1>AdVehicles Admin</h1>

  <!-- LOGIN (no <form>, no submit → no refresh) -->
  <div id="login" class="login">
    <div class="card">
      <h3>Sign in</h3>
      <div class="row">
        <input id="user" placeholder="Admin user" autocomplete="username" />
        <input id="pass" placeholder="Admin password" type="password" autocomplete="current-password" />
      </div>
      <div class="row" style="margin-top:8px">
        <label><input type="checkbox" id="remember" /> remember for this tab</label>
        <button id="signin" type="button">Sign in</button>
        <span id="loginStatus" class="muted"></span>
      </div>
      <div id="loginErr" class="muted" style="color:#b00020;margin-top:8px"></div>
      <pre id="debug" class="debug" style="margin-top:12px">(debug will appear here)</pre>
    </div>
  </div>

  <!-- APP -->
  <div id="app" hidden>
    <div class="toolbar row">
      <select id="statusFilter">
        <option value="pending">pending</option>
        <option value="approved">approved</option>
        <option value="rejected">rejected</option>
        <option value="all">all</option>
      </select>
      <button id="refresh" type="button">Refresh</button>
      <span id="count" class="muted"></span>
      <span style="flex:1"></span>
      <button id="signout" type="button">Sign out</button>
    </div>

    <div id="list" class="grid"></div>
  </div>

  <!-- External JS only (CSP-friendly) -->
  <script src="/js/admin.js"></script>
</body>
</html>
