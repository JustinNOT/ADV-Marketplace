<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — AdVehicles</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .card { border: 1px solid var(--border-1,#2a2a2a); border-radius: 12px; padding: 14px; margin: 12px 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .muted { opacity: .75; }
    .pill { padding: 2px 8px; border: 1px solid var(--border-1,#2a2a2a); border-radius: 999px; font-size: 12px; }
    .thumb { width: 180px; max-height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-1,#2a2a2a); }
    details pre { white-space: pre-wrap; word-wrap: break-word; }
    .right { margin-left: auto; }
    .btn { padding: 8px 12px; border: 1px solid var(--border-1,#2a2a2a); border-radius: 8px; text-decoration: none; cursor: pointer; }
    .ok { background: var(--ok-bg, transparent); }
    .warn { background: var(--warn-bg, transparent); }
    .danger { background: var(--danger-bg, transparent); }
    #app[hidden], #login[hidden] { display: none !important; }
    textarea, input { border-radius: 8px; border: 1px solid var(--border-1,#2a2a2a); padding: 8px; }
    select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border-1,#2a2a2a); }
    #debug { margin-top: 10px; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <header class="container row" style="justify-content:space-between;align-items:center;">
    <h1>Admin</h1>
    <a class="btn" href="/index.html">← Back to Home</a>
  </header>

  <!-- LOGIN VIEW -->
  <section id="login" class="container card">
    <h3>Sign in</h3>
    <div class="row">
      <input id="user" placeholder="Admin user" autocomplete="username" />
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password" />
      <label class="row" style="gap:6px; align-items:center;">
        <input id="remember" type="checkbox" /> remember
      </label>
      <button id="signin" class="btn">Sign in</button>
      <span id="loginErr" class="muted"></span>
    </div>
    <pre id="debug" class="muted"></pre>
  </section>

  <!-- APP VIEW -->
  <section id="app" class="container" hidden>
    <div class="row" style="margin-bottom:10px;">
      <label>Filter:
        <select id="statusFilter">
          <option value="pending" selected>pending</option>
          <option value="approved">approved</option>
          <option value="rejected">rejected</option>
          <option value="all">all</option>
        </select>
      </label>
      <button id="refresh" class="btn">Refresh</button>
      <span class="right">
        <button id="signout" class="btn">Sign out</button>
      </span>
    </div>

    <div class="row" style="margin: 6px 0;">
      <strong id="count"></strong>
    </div>

    <!-- DRIVER LIST RENDERED BY admin.js -->
    <div id="list"></div>
  </section>

  <!-- Your existing admin logic -->
  <script src="/js/admin.js"></script>

  <!-- Tiny helper to auto-fill the JSON <pre> blocks when admin.js has rendered cards -->
  <script>
    // This hook lets admin.js supply raw objects if you ever want.
    // Not required; admin.js will fill the <pre> itself (see patch below).
    window.__adv_setDriverJson = function (id, obj) {
      var pre = document.getElementById('json_' + id);
      if (pre) pre.textContent = JSON.stringify(obj, null, 2);
    };
  </script>
</body>
</html>
